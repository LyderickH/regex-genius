<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background with subtle glow -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#gradient-accent)" stroke-width="12" stroke-opacity="0.5" />
  
  <!-- Central Regex Symbol ( . * ? ) -->
  <!-- Opening Parenthesis -->
  <path d="M150 170 C120 220 120 292 150 342" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" />
  
  <!-- Dot . -->
  <circle cx="200" cy="300" r="18" fill="#38bdf8" />
  
  <!-- Asterisk * -->
  <g transform="translate(260, 256)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" />
    <line x1="-15" y1="-26" x2="15" y2="26" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" />
    <line x1="-15" y1="26" x2="15" y2="-26" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Closing Parenthesis -->
  <path d="M320 170 C350 220 350 292 320 342" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" />

  <!-- Genius Sparkle Star -->
  <path d="M390 120 Q400 155 435 165 Q400 175 390 210 Q380 175 345 165 Q380 155 390 120 Z" fill="url(#gradient-accent)" />
  <circle cx="390" cy="165" r="8" fill="#ffffff" />
</svg>
